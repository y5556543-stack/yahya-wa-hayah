<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم يحيى وحياة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#3b3350;--mut:#7a7290;--pri:#4fb6a8;--pri2:#e86f9a;--sun:#ffc94d;--ok:#4caf6d;--bad:#e5735c;--line:#f0e3c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262033;--card:#352d47;--ink:#fdf3e0;--mut:#b9b0cf;--line:#4a4060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#262033;--card:#352d47;--ink:#fdf3e0;--mut:#b9b0cf;--line:#4a4060;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:19px;line-height:1.7;padding-bottom:84px}
#top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--pri);color:#fff;font-weight:900;font-size:16px}
#top span,#top button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:20px;padding:2px 10px;margin-inline-start:5px;font:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:14px}
h2{margin:6px 0 10px;font-weight:900}h3{margin:4px 0 8px}small{color:var(--mut)}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.hero{text-align:center;background:linear-gradient(#bfe9e2,var(--bg));border-radius:28px;padding:14px;margin-bottom:14px}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:8px;background:linear-gradient(#cdeef0,#fdf1c9);border-radius:20px;padding:10px;margin-bottom:10px}
.kid{height:auto;display:block}.ayah{font-family:'Amiri Quran','Amiri',serif;font-size:27px;font-weight:700;text-align:center;color:var(--pri2);line-height:2.1;background:var(--bg);border-radius:16px;padding:6px 10px;margin:6px 0 10px}.sideimg{width:86px;height:auto;max-height:150px;object-fit:contain;align-self:center;border-radius:14px}.hero .k3 .kid.h{width:92px}.hero .k3 .kid.y{width:82px}.kid.cust{aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}.qimg{display:block;max-width:100%;max-height:200px;margin:8px auto;border-radius:14px}.ta{width:100%;min-height:90px;font:700 21px 'Amiri Quran',Cairo,serif;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}.sel{width:100%;font:700 18px Cairo,sans-serif;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0}.logo{background:#fff;border-radius:22px;padding:8px 16px;max-width:210px;margin:0 auto 10px}.logo img{width:100%;height:auto;display:block}.lg{height:38px;width:auto;background:#fff;border-radius:10px;padding:2px 5px}.kid.h{width:104px}.kid.y{width:92px}.hero .kid.h{width:124px}.hero .kid.y{width:110px}
.props{font-size:38px;align-self:center}
.bubble{background:#fff;color:#3b3350;border-radius:20px;padding:6px 14px;margin:8px 0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:24px;padding:14px 8px;font:900 18px Cairo,sans-serif;color:#fff;cursor:pointer;min-height:90px}
.tile i{display:block;font-style:normal;font-size:32px}
.btn{border:0;border-radius:18px;background:var(--pri2);color:#fff;font:900 18px Cairo,sans-serif;padding:12px 20px;cursor:pointer;min-height:48px;margin:4px 0}
.btn.alt{background:var(--pri)}.btn.gr{background:var(--mut)}
.opt{display:block;width:100%;text-align:center;margin:8px 0;padding:12px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font:700 19px Cairo,sans-serif;cursor:pointer;min-height:50px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.chip{display:inline-block;margin:4px;padding:8px 14px;border-radius:14px;background:var(--sun);color:#3b3350;font:900 20px Cairo,sans-serif;border:0;cursor:pointer}
.ans{min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:4px;margin:8px 0}
.fb{margin-top:10px;font-weight:700}
.row{display:flex;gap:12px;align-items:center}.em{font-size:38px}
.big{font-size:42px;text-align:center;font-weight:900;color:var(--pri2);margin:6px 0}
.badge{display:flex;gap:12px;align-items:center;opacity:.35;filter:grayscale(1)}.badge.on{opacity:1;filter:none}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}.bar b{display:block;height:100%;background:var(--sun)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv button{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:900 17px Cairo,sans-serif;padding:6px 0;min-height:58px;cursor:pointer}
.lv button.cur{border-color:var(--pri2)}.lv button:disabled{opacity:.4}
input[type=text],input[type=password],input[type=number]{width:100%;font:700 19px Cairo,sans-serif;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0}
.av button{font-size:30px;border:3px solid var(--line);background:var(--card);border-radius:50%;width:54px;height:54px;margin:3px;cursor:pointer}
.av button.on{border-color:var(--pri2);background:var(--sun)}
.note{font-size:15px;color:var(--mut);background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
.dots span{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--line);margin:2px}.dots span.on{background:var(--sun)}
a.btn{display:inline-block;text-decoration:none}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:700 12px Cairo,sans-serif;padding:8px 2px;cursor:pointer}
nav button b{display:block;font-size:24px;font-weight:400}nav button.on{color:var(--pri2)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--sun);color:#3b3350;font-weight:900;padding:8px 20px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none;z-index:9;text-align:center}
#toast.s{opacity:1}
</style>
</head>
<body>
<div id="top"></div><div id="toast"></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var D={u:{},cur:null,cfg:{center:'مركز القرآن حياة',bonus:20,qpts:5,reward:'🏆 نجم الأسبوع',pin:'1258',links:{},extra:[],snd:0}};
try{var L=JSON.parse(localStorage.getItem('yh2')||'null');if(L){D=L;D.cfg=Object.assign({center:'مركز القرآن حياة',bonus:20,qpts:5,reward:'🏆 نجم الأسبوع',pin:'1258',links:{},extra:[],snd:0},D.cfg)}}catch(e){}

function U(){return D.u[D.cur]}

function cnt(p){var u=U();return Object.keys(u.done).filter(function(k){return k.indexOf(p)==0}).length}
function beep(ok){if(!D.cfg.snd)return;try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}

function add(p,s,m){var u=U();u.pts+=p;u.stars+=s;var w=wkey();u.wk[w]=(u.wk[w]||0)+p;save();top_();toast(m||('+'+p+' نقطة ⭐'))}
